# DINOv3 LoRA with the concept head used by the core method.
# Replace dataset, backbone weight, and concept matrix paths before running.
data:
  train_dataroot: "./datasets"
  train_split: "train"
  test_dataroot: "./datasets/test"
  val_split: "val"

models:
  checkpoints_dir: "./checkpoints"

training:
  trainmode: "dinov3"
  dinov3_variant: "vitl16"
  dinov3_backend: "official"
  dinov3_repo_path: "./external/dinov3"
  dinov3_weights: "./weights/backbones/dinov3-vitl16/model.safetensors"
  dinov3_accel_backend: "none"

  freeze_backbone: true
  trainable_blocks: 0
  head_hidden_dim: 512
  head_dropout: 0.2
  use_lora: true
  lora_rank: 4
  lora_alpha: 8
  lora_dropout: 0.0
  lora_bias: "none"
  lora_target_modules: []
  lora_target_last_n:

  dinov3_use_concept_head: true
  dinov3_concept_matrix_path: "./weights/concepts/dinov3_concept_matrix.npy"
  dinov3_concept_mapping_trainable: true
  dinov3_concept_mapping_bias: false
  dinov3_concept_head_hidden_dim:
  dinov3_concept_head_dropout: 0.0
  dinov3_concept_sparsity_ratio: 0.0
  dinov3_concept_loss_weight: 1.0
  dinov3_concept_eval_sparsity: [0.1, 0.3, 0.5, 0.7, 0.9]

  num_classes: 1
  optim: "adam"
  beta1: 0.9
  weight_decay: 0.0
  lr: 0.00002
  lr_decay_factor: 0.9
  lr_min: 0.000001
  batch_size: 32
  niter: 5
  delr_freq: 5
  loss_freq: 100

  data_aug: true
  no_resize: false
  no_flip: false
  loadSize: 224
  cropSize: 224
  class_bal: false
  serial_batches: false

  seed: 100
  gpu_ids: "0"
  name: "dinov3_vitl16_concept_stage2"
  initial_eval: false
  continue_train: true
  epoch: "./weights/detectors/dinov3_vitl16_lora_stage1.pth"
  new_optim: true
  save_last_checkpoint: true

testing:
  batch_size: 64
  data_aug: false
  no_resize: false
  no_crop: false
  groups:
    - name: "example_test"
      path: "./datasets/test/example"
      mode: "single"

logging:
  tensorboard: true
  log_file: "training.log"
  print_options: true

system:
  num_threads: 8
  ddp_timeout_minutes: 180
