# Stage 2: initialize from the stage-1 CLIP-LoRA detector and train the
# patch-token codebook branch. The released raw centers are L2-normalized at load time.
data:
  train_dataroot: "./datasets"
  train_split: "train"
  test_dataroot: "./datasets/test"
  val_split: "val"

models:
  checkpoints_dir: "./checkpoints"
  pretrained:
    clip_model: "./weights/backbones/ViT-L-14.pt"

training:
  trainmode: "lora"
  modelname: "CLIP:ViT-L/14"
  clip_use_main_head: true
  clip_train_fc: true
  clip_train_lora: false
  clip_lora_rank: 4
  clip_lora_alpha: 8
  clip_freeze_backbone: true
  clip_load_init_weights: true

  clip_use_codebook_inject: true
  clip_codebook_path: "./assets/codebooks/cleandift_codebook.npy"
  clip_codebook_dim: 1280
  clip_num_concepts: 200
  clip_tau: 0.1
  clip_codebook_l2: true
  clip_freeze_codebook: true
  clip_cb_loss_weight: 1.0
  clip_num_patches: 256
  clip_cb_topk: 20
  clip_cb_topr: 8
  clip_cb_tau_w: 0.05
  clip_cb_weight_mode: "score"
  clip_cb_mlp_hidden: 768
  clip_cb_detach_tokens: true

  num_classes: 1
  legacy_preprocess: true
  optim: "adam"
  beta1: 0.9
  weight_decay: 0.0
  lr: 0.00002
  lr_decay_factor: 0.9
  lr_min: 0.000001
  batch_size: 32
  niter: 2
  delr_freq: 5
  loss_freq: 100

  data_aug: true
  loadSize: 224
  cropSize: 224
  class_bal: false
  serial_batches: false

  seed: 100
  gpu_ids: "0"
  name: "clip_vitl14_codebook_stage2"
  initial_eval: false
  continue_train: true
  epoch: "./weights/detectors/clip_vitl14_lora_stage1.pth"
  new_optim: true
  save_last_checkpoint: true

testing:
  batch_size: 64
  data_aug: false
  no_resize: false
  no_crop: false
  groups:
    - name: "example_test"
      path: "./datasets/test/example"
      mode: "single"

logging:
  tensorboard: true
  log_file: "training.log"
  print_options: true

system:
  num_threads: 8
